[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "need-to-know"
version = "0.1.0"
description = "A privacy-aware context layer for agents acting on personal cloud data: provenance-tracked data, purpose-based access, trust scoring, action gating and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ntk = "needtoknow.cli:main"

[tool.setuptools.packages.find]
include = ["needtoknow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
